name: Check loader upstream
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: node scripts/loader-sync.mjs upstream
