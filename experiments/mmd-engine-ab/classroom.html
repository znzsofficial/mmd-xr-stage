<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="connect-src 'self' blob: data:; img-src 'self' blob: data:; worker-src 'self' blob:;"><title>Babylon 教室 · Quest 实验</title>
<style>*{box-sizing:border-box}body{font:16px/1.5 system-ui;margin:0;background:#f6f5ef;color:#20332c}main{max-width:1100px;margin:auto;padding:.8rem}h1{font-size:1.3rem;margin:0}section{display:flex;gap:.45rem;flex-wrap:wrap;align-items:center;margin:.6rem 0}label{display:inline-flex;gap:.3rem;align-items:center}button,select,input{font:inherit;max-width:100%}button{padding:.34rem .6rem}p{margin:.35rem 0}canvas{width:100%;height:55vh;display:block;touch-action:none}output{font-weight:600}pre{overflow:auto;font-size:.85rem}</style>
<link rel="icon" href="data:,"><main><h1>Babylon 教室 · Quest 实验</h1><p>本地选 PMX 包和可选的 VMD，或先试测试布片。只有一个角色；退出 VR 后保留本页的位置和播放时间。</p>
<section><label>ZIP 或散件 <input id="files" type="file" multiple></label><label>或目录 <input id="folder" type="file" webkitdirectory multiple></label></section>
<section><label>角色 <select id="pmx"></select></label><label>身体动作 <select id="vmd"></select></label><label><input id="physics" type="checkbox" checked>加载时开物理</label><button id="load" disabled>放入角色</button><button id="demo">试测试布片</button></section>
<canvas id="view" tabindex="0" aria-label="教室画面"></canvas><section><button id="xr" disabled>进入 VR</button><button id="play" disabled>播放</button><button id="place" disabled>点击地面摆放</button><button id="reset">重置镜头</button><button id="save" disabled>导出本次 XR 记录</button></section>
<p>屏幕：拖动环绕、滚轮缩放、WASD 移动、Q/E 转头、F/C 升降、R 重置。VR：右 A 播放/暂停、左扳机指地松开摆放、右 B 退出。两个小球对应手柄握把，直接用它们托衣摆；布片很小时可从下方慢慢托起。</p>
<output id="status" role="status">正在打开教室…</output><details><summary>开发测试</summary><button id="trial">运行暂停拨衣对照</button> <button id="garment" disabled>测所选角色的裙摆</button><pre id="results"></pre></details></main><script type="module" src="./classroom.js"></script></html>
