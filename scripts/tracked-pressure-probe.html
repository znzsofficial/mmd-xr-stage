<!doctype html><meta charset="utf-8"><title>Tracked fingertip and palm at paused pose zero</title><input type="file" multiple><button>Compare</button><pre></pre>
<script type="module">
import * as T from 'three';
import {createMmdRuntimeHandle} from '../src/mmdVrShowcase/mmdRuntime/mmdRuntime.ts';
import {fitChestCompression} from '../src/mmdVrShowcase/mmdRuntime/chestCompression.ts';
import {handContactShape} from '../src/mmdVrShowcase/handContactProfile.ts';
window.compare=async()=>{const files=Array.from(document.querySelector('input').files),file=files.find(f=>/\.pmx$/i.test(f.name)),rows=[];
 for(const [slot,scale] of [[0,.1],[7,.15]]){const parked=()=>new T.Matrix4().makeTranslation(0,-1000,0),hands=Array.from({length:12},parked),controllers=[parked(),parked()],scene=new T.Scene(),cam=new T.PerspectiveCamera();
 const rt=createMmdRuntimeHandle(scene,{chestCompression:()=>false,handColliders:()=>hands,controllerColliders:()=>controllers,handShape:handContactShape,handColliderRadius:()=>.033});
 try{const {modelId}=await rt.addModel(file,files,{physics:true,transform:{scale,rotationY:42,positionX:.65}});const tick=()=>rt.update(0,true,cam,1,false,1/60);let mesh;rt.getModelRoot(modelId).traverse(n=>{if(n.isSkinnedMesh&&!mesh)mesh=n});const pads=fitChestCompression(mesh)?.affectedBones;if(!pads?.length)throw Error('No supported chest skeleton');
 const raw=pads.map(b=>b.scale.clone()),squeeze=()=>Math.max(...pads.map((b,i)=>b.scale.distanceTo(raw[i])));for(let i=0;i<60;i++)tick();const bone=pads.find(b=>!pads.some(p=>p.parent===b))??pads[0],pos=bone.getWorldPosition(new T.Vector3()),front=new T.Vector3(0,0,1).transformDirection(mesh.matrixWorld),far=pos.clone().addScaledVector(front,1),at=new T.Vector3(),hand=hands[slot];
 const move=t=>{at.lerpVectors(far,pos,t);hand.setPosition(at);tick()};for(let i=0;i<8;i++)move(0);let peak=0;for(let i=0;i<=80;i++){move(i/80);peak=Math.max(peak,squeeze());}for(let i=80;i>=0;i--)move(i/80);for(let i=0;i<90;i++)move(0);const release=squeeze();hand.copy(parked());tick();let regain=0;for(let i=0;i<12;i++){move(1);regain=Math.max(regain,squeeze())}const row={slot,scale,peak,release,regain};rows.push(row);if(!(peak>.005&&release<.0002&&regain<.0002))throw Error(JSON.stringify(row));
 }finally{rt.dispose()}}
 return rows};document.querySelector('button').onclick=async()=>document.querySelector('pre').textContent=JSON.stringify(await window.compare(),null,2);
</script>
